name: 테스트

# PR을 열거나 고칠 때마다 단위 테스트와 프롬프트 동기화를 자동으로 확인한다.
# 리뷰어는 PR 화면 아래 체크 표시(✓)로 결과를 볼 수 있다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: 크롬 확장 프롬프트가 공통 프롬프트와 같은지 확인
        run: python scripts/sync_prompt.py --check

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
