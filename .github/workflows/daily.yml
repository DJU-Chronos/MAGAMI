name: 매일 공지 수집

# 하루 1회: 허용된 메인 공지 칸 수집 → data 브랜치의 notices.json 갱신 → 새 공지 이메일 알림
# - main은 보호 규칙(PR 필수) 때문에 직접 커밋할 수 없어서 결과는 data 브랜치에 저장한다.
# - fork한 레포에서는 Actions 탭에서 워크플로를 직접 켜야 예약 실행이 동작한다.

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 (한국 시간)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: 이전 공지 목록 가져오기
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null && git show FETCH_HEAD:notices.json > data/notices.json 2>/dev/null; then
            echo "기존 목록을 불러왔습니다."
          else
            echo "[]" > data/notices.json
            echo "기존 목록이 없어 새로 시작합니다."
          fi

      - name: 수집하고 새 공지 알리기
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m magami.daily --store data/notices.json

      - name: data 브랜치에 저장
        run: |
          cp data/notices.json "$RUNNER_TEMP/notices.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git checkout -B data FETCH_HEAD
          else
            git checkout --orphan data
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/notices.json" notices.json
          git add notices.json
          if git diff --cached --quiet; then
            echo "바뀐 공지가 없습니다."
          else
            git commit -m "[데이터] 공지 목록 갱신 $(TZ=Asia/Seoul date +%F)"
            git push origin data
          fi
