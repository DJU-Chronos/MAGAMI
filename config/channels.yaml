# 매일 자동으로 확인할 홈페이지 메인 공지 칸 목록
# 다른 학교에서 쓰려면 이 파일의 주소만 바꾸면 됩니다.
# 채널을 추가하기 전에 docs/collection-policy.md 기준으로 수집 허용 여부를 확인하세요.
#
# - 메인 페이지의 최신 공지 칸에서 제목·날짜·링크만 가져옵니다. (공지 본문은 열지 않습니다)
# - 본문 속 마감일은 크롬 확장 프로그램이나 프롬프트 방식으로 정리합니다.
# - 인스타그램은 자동 수집하지 않습니다. (docs/decisions.md D3)

school: 대전대학교

homepages:
  # - name: 사이트 이름
  #   url: https://
  #   robots_allowed: null   # 확인 후 true / false
  #   enabled: false         # 확인 완료 후 true
  #   tab: 공지사항          # (선택) 메인 페이지 공지 칸의 제목이 '공지사항'이 아니면 적기
  - name: SW중심대학사업단
    url: https://www.dju.ac.kr/sw/main.do
    robots_allowed: true
    enabled: true
  - name: 앵커사업단(RISE)
    url: https://www.dju.ac.kr/djurise/main.do
    robots_allowed: true
    enabled: true
  - name: 대학혁신지원사업
    url: https://www.dju.ac.kr/inno/main.do
    robots_allowed: true
    enabled: true
    tab: 사업단소식          # 이 사이트는 공지 칸 제목이 '사업단소식'
  - name: HRD사업단
    url: https://www.dju.ac.kr/hrd/main.do
    robots_allowed: true
    enabled: true
  - name: 바이오헬스혁신융합대학사업단
    url: https://www.dju.ac.kr/biohealth/main.do
    robots_allowed: true
    enabled: true
  - name: 사물인터넷혁신융합대학사업단
    url: https://www.dju.ac.kr/IoTCOSS/main.do
    robots_allowed: true
    enabled: true
