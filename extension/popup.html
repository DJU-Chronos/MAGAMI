<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>마감이</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>마감이</strong>
    <nav>
      <a href="#" id="show-saved">내 마감 목록 <span id="saved-count"></span></a>
      <a href="#" id="open-options">설정</a>
    </nav>
  </header>

  <section id="start">
    <p class="hint">지금 열려 있는 공지 <b>한 개</b>만 읽어 마감일을 정리합니다.</p>
    <label class="check">
      <input type="checkbox" id="with-images" checked>
      포스터 이미지도 함께 보내기 (날짜가 이미지에만 있을 때)
    </label>
    <button id="run" class="primary">이 공지 정리하기</button>
  </section>

  <p id="status" class="status" hidden></p>

  <!-- 1단계: AI 결과를 사용자가 확인·수정 -->
  <form id="result" hidden>
    <p id="not-notice" class="warn" hidden>신청 기간이나 마감일이 있는 공지가 아닌 것 같습니다.</p>
    <p class="hint">AI가 정리한 결과입니다. <a id="r-url" target="_blank" rel="noopener">원문</a>과 대조하고 틀린 곳은 고쳐 주세요.</p>
    <label>행사명 <input name="title" type="text"></label>
    <div class="row">
      <label>마감일 <input name="deadline" type="date"></label>
      <label>시각 <input name="deadline_time" type="time"></label>
    </div>
    <div class="row">
      <label>신청 시작 <input name="apply_start" type="date"></label>
      <label>신청 종료 <input name="apply_end" type="date"></label>
    </div>
    <label>대상 <input name="target" type="text"></label>
    <label>신청 방법 <input name="how_to_apply" type="text"></label>
    <p id="r-source" class="tiny"></p>

    <!-- 2단계: 확인한 값으로 저장·등록 -->
    <div class="buttons">
      <button type="submit" id="save" class="primary">확인하고 저장</button>
      <a id="add-calendar" class="button" target="_blank" rel="noopener">구글 캘린더에 추가</a>
      <button type="button" id="save-json">JSON</button>
      <button type="button" id="copy-json">복사</button>
    </div>
  </form>

  <!-- 내 마감 목록 (이 브라우저에만 저장) -->
  <section id="saved" hidden>
    <h2>내 마감 목록</h2>
    <p class="hint">이 브라우저에만 저장됩니다. 체크 화면(Streamlit)에 올리려면 <b>전체 JSON 저장</b>.</p>
    <ul id="saved-list"></ul>
    <div class="buttons">
      <button type="button" id="export-all">전체 JSON 저장</button>
      <button type="button" id="back">닫기</button>
    </div>
  </section>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
